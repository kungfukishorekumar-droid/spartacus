# ============================================================
# Spartacus — keep the blog-dist branch in sync with the blog build
# ------------------------------------------------------------
# The root of the `blog-dist` branch IS the document root of
# blog.spartacusmartialarts.com, so Hostinger's hPanel Git can deploy it
# straight into public_html/blog with no build step.
#
# This workflow needs NO secrets from you: it authenticates with the
# GITHUB_TOKEN that GitHub provides to every workflow run.
#
# After a run, click Deploy in hPanel (or turn on Auto-deployment) and the
# blog is live.
# ============================================================
name: Publish blog-dist branch

on:
  push:
    branches: [main]
    # only rebuild when something the blog is actually made of changes
    paths:
      - "data/**"
      - "images/**"
      - "assets/**"
      - "fonts/**"
      - "blog.html"
      - "blog-post.html"
      - "blog.js"
      - "blog-lead.js"
      - "blog.css"
      - "site-base.js"
      - "app.js"
      - "track.js"
      - "analytics.js"
      - "ux.*"
      - "fx.*"
      - "styles.css"
      - "content.json"
      - "llms.txt"
      - "tools/build-blog-site.mjs"
      - ".github/workflows/publish-blog-branch.yml"
  workflow_dispatch:

permissions:
  contents: write          # needed to force-push the built branch

concurrency:
  group: publish-blog-dist
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the blog
        run: |
          node tools/build-blog-site.mjs
          test -f dist-blog/blog.html
          test -f dist-blog/.htaccess
          test -f dist-blog/sitemap.xml
          echo "Built $(find dist-blog -type f | wc -l) files."

      - name: Force-push the build to blog-dist
        run: |
          cd dist-blog
          git init -q -b blog-dist
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '* -text\n' > .gitattributes
          git add -A
          git commit -q -m "Built blog from ${GITHUB_SHA::7}

          Generated by tools/build-blog-site.mjs. Do not edit this branch
          by hand — it is force-pushed on every build."
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" blog-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### blog-dist updated"
            echo ""
            echo "Articles published: $(grep -c '<url>' dist-blog/sitemap.xml)"
            echo ""
            echo "Deploy it in hPanel → Website → Git → **Deploy**, or enable"
            echo "Auto-deployment there so this happens on its own."
          } >> "$GITHUB_STEP_SUMMARY"
