# ============================================================
# Build the Spartacus blog and deploy it to Hostinger Node.js hosting.
#
# BEFORE THIS WORKS, add these repository secrets
# (GitHub → Settings → Secrets and variables → Actions):
#
#   HOSTINGER_SSH_HOST        e.g. 123.45.67.89   (hPanel → Advanced → SSH Access)
#   HOSTINGER_SSH_PORT        usually 65002
#   HOSTINGER_SSH_USER        e.g. u123456789
#   HOSTINGER_SSH_KEY         the PRIVATE key whose public half is in hPanel → SSH Keys
#   HOSTINGER_APP_PATH        absolute path of the Node.js app root on the server,
#                             e.g. /home/u123456789/domains/blog.spartacusmartialarts.com/app
#   NEXT_PUBLIC_SITE_URL      https://blog.spartacusmartialarts.com
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#
# The two NEXT_PUBLIC_* Supabase values are needed at BUILD time because they
# are inlined into the client bundle. The secret ones (service role key,
# Higgsfield key, admin hash) are runtime-only and live in the Hostinger app's
# own environment variables — they are deliberately NOT in this workflow.
# ============================================================
name: Deploy blog

on:
  push:
    branches: [main]
    paths:
      - 'spartacus-blog/**'
      - '.github/workflows/deploy-blog.yml'
  workflow_dispatch:

concurrency:
  group: deploy-blog
  cancel-in-progress: true

defaults:
  run:
    working-directory: spartacus-blog

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spartacus-blog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_OUTPUT_STANDALONE: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      # `output: standalone` emits a server plus a pruned node_modules, but not
      # the static assets — those have to be copied in alongside it.
      - name: Assemble the deployable bundle
        run: |
          set -euo pipefail
          rm -rf deploy && mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          if [ -d public ]; then cp -r public deploy/public; fi
          # Hostinger's process manager starts the app with `npm start`.
          cat > deploy/package.json <<'JSON'
          {
            "name": "spartacus-blog",
            "version": "1.0.0",
            "private": true,
            "scripts": { "start": "node server.js" }
          }
          JSON
          ls -la deploy

      - name: Set up the SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.HOSTINGER_SSH_PORT }}" -H "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts

      # Deploy into a timestamped release directory and flip a symlink, so a
      # half-uploaded build never serves traffic and a rollback is one `ln -s`.
      - name: Upload the release
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          set -euo pipefail
          RELEASE="release-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$APP_PATH/releases/$RELEASE'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            deploy/ "$SSH_USER@$SSH_HOST:$APP_PATH/releases/$RELEASE/"

      - name: Activate the release and restart the app
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<EOSSH
          set -euo pipefail
          cd "$APP_PATH"
          ln -sfn "releases/$RELEASE" current.tmp && mv -Tf current.tmp current
          # Keep the five most recent releases, drop the rest.
          ls -1dt releases/*/ | tail -n +6 | xargs -r rm -rf
          # Restart however this host runs the app. Adjust to match your setup:
          #   • Hostinger hPanel Node.js app  → touch the restart trigger
          #   • pm2                           → pm2 reload spartacus-blog
          if command -v pm2 >/dev/null 2>&1; then
            pm2 reload spartacus-blog --update-env || pm2 start current/server.js --name spartacus-blog
          else
            mkdir -p tmp && touch tmp/restart.txt
          fi
          EOSSH

      - name: Smoke-check the live site
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/robots.txt" || echo 000)
            if [ "$code" = "200" ]; then echo "Live: robots.txt returned 200"; exit 0; fi
            echo "Attempt $attempt: got $code, retrying in 10s"; sleep 10
          done
          echo "The site did not come back healthy after the deploy." >&2
          exit 1
