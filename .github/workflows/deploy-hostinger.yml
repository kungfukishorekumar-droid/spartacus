# ============================================================
# Spartacus — deploy to Hostinger on every push
# ------------------------------------------------------------
# Deploys TWO targets from this one repository:
#   1. the main site  → spartacusmartialarts.com
#   2. the blog build → blog.spartacusmartialarts.com
#
# The blog's document root is public_html/blog, which sits INSIDE the main
# site's document root. The main-site job therefore excludes blog/** so a
# main-site deploy can never wipe the blog.
#
# This workflow is OPTIONAL. Without the secrets below it skips cleanly and
# reports success, because the site deploys through hPanel Git by default.
# To use FTP instead — GitHub → Settings → Secrets and variables → Actions:
#   HOSTINGER_FTP_SERVER    145.79.25.192
#   HOSTINGER_FTP_USERNAME  u824263812
#   HOSTINGER_FTP_PASSWORD  (your hosting FTP password, from hPanel → Files → FTP Accounts)
# ============================================================
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you deploy manually from any branch

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Are the FTP secrets configured?
        id: cfg
        env:
          SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          if [ -n "$SERVER" ] && [ -n "$USERNAME" ] && [ -n "$PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All FTP secrets present — deploying."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP secrets are not set, so this optional deploy is skipped."
            echo "The site deploys through Hostinger hPanel Git instead (see DEPLOYMENT.md)."
            echo "To switch FTP deploys on, add HOSTINGER_FTP_SERVER, HOSTINGER_FTP_USERNAME"
            echo "and HOSTINGER_FTP_PASSWORD under Settings -> Secrets and variables -> Actions."
          fi

      - name: Set up Node
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the blog bundle
        if: steps.cfg.outputs.ready == 'true'
        run: |
          node tools/build-blog-site.mjs
          test -f dist-blog/blog.html
          test -f dist-blog/.htaccess
          test -f dist-blog/sitemap.xml
          echo "Bundle contains $(find dist-blog -type f | wc -l) files."

      # ---------- 1. MAIN SITE ----------
      - name: Deploy main site → spartacusmartialarts.com
        if: steps.cfg.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: /domains/spartacusmartialarts.com/public_html/
          # never let a main-site deploy touch the blog subdomain's document root
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            blog/**
            dist-blog/**
            tools/**
            supabase/**
            backend/**
            .github/**
            **/*.md
            **/*.sql
            dist-blog.zip
            server.js
            package.json
            package-lock.json
            spartacus website.code-workspace

      # ---------- 2. BLOG SUBDOMAIN ----------
      - name: Deploy blog → blog.spartacusmartialarts.com
        if: steps.cfg.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist-blog/
          server-dir: /domains/spartacusmartialarts.com/public_html/blog/

      - name: Summary
        if: steps.cfg.outputs.ready == 'true'
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| Target | URL |"
            echo "|---|---|"
            echo "| Main site | https://spartacusmartialarts.com |"
            echo "| Blog | https://blog.spartacusmartialarts.com |"
            echo ""
            echo "Blog articles published: $(grep -c '<url>' dist-blog/sitemap.xml)"
          } >> "$GITHUB_STEP_SUMMARY"
